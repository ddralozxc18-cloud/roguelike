<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rygalik — Low-Poly Wastelands</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="game-container" tabindex="-1"></div>
  
  <div id="menu-frame-container" class="screen">
    <iframe id="menu-frame" src="menu.html"></iframe>
  </div>
  
  <div id="pause-screen" class="screen hidden">
    <div class="menu-card">
      <h1 class="menu-title small">Paused</h1>
      <button id="resume-btn" class="btn-primary">Resume</button>
      <div class="sens-label">
        <label for="sensitivity-slider-pause">Mouse Sensitivity</label>
        <input type="range" id="sensitivity-slider-pause" min="0.1" max="3" step="0.1" value="1">
      </div>
      <label class="fps-toggle-label">
        <input type="checkbox" id="fps-toggle">
        FPS Counter
      </label>
      <button id="restart-btn" class="btn-secondary">Restart</button>
    </div>
  </div>
  
  <div id="death-screen" class="screen hidden">
    <div class="menu-card">
      <h1 class="menu-title">You have fallen...</h1>
      <p class="menu-subtitle">The lands have claimed their due — but your journey is not over.</p>
      <button id="respawn-btn" class="btn-primary">Respawn</button>
    </div>
  </div>
  
  <div id="inventory-screen" class="screen hidden">
    <div class="inventory-card">
      <h2 class="inventory-title">Inventory</h2>
      <div id="equipment-container"></div>
      <div id="inventory-grid"></div>
      <p class="inventory-hint-text">Click an item to use it</p>
      <button id="close-inventory-btn" class="btn-secondary">Close (I)</button>
    </div>
  </div>
  
  <div id="hud" class="hidden">
    <div id="crosshair">
      <span></span>
      <span></span>
    </div>
    
    <div id="stats-panel">
      <div id="level-row">
        <span class="level-label">Level <span id="level-value">1</span></span>
        <div class="xp-track">
          <div class="xp-fill" id="xp-fill"></div>
        </div>
      </div>
      <div class="stats-container">
        <div class="bar-row">
          <span class="bar-icon hp-icon">♥</span>
          <div class="bar-track">
            <div class="bar-fill hp-fill" id="hp-fill"></div>
          </div>
          <span class="bar-value"><span id="hp-value">100/100</span></span>
          <span class="regen-value" id="hp-regen">+0/s</span>
        </div>
        <div class="bar-row">
          <span class="bar-icon mana-icon">✦</span>
          <div class="bar-track">
            <div class="bar-fill mana-fill" id="mana-fill"></div>
          </div>
          <span class="bar-value"><span id="mana-value">100/100</span></span>
          <span class="regen-value" id="mana-regen">+0/s</span>
        </div>
      </div>
    </div>
    
    <div id="gem-counter">
      <span class="bar-icon gem-icon">◆</span>
      <span id="gem-count">0</span>
    </div>
    
    <div id="active-slots-hud">
      <div class="hud-active-slot">
        <span class="slot-key">Shift</span>
        <span class="slot-icon" id="hud-active1-icon"></span>
      </div>
      <div class="hud-active-slot">
        <span class="slot-key">C</span>
        <span class="slot-icon" id="hud-active2-icon"></span>
      </div>
    </div>
    
    <div id="pickup-prompt" class="hidden"></div>
    <div id="inventory-hint">I — Inventory</div>
  </div>
  
  <div id="damage-vignette"></div>
  <div id="fps-counter"></div>
  
  <div id="cheat-console" class="hidden">
    <div id="console-input-wrapper">
      <span id="console-prompt">&gt;</span>
      <input type="text" id="console-input" placeholder="Enter command...">
    </div>
    <div id="console-output"></div>
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <!-- Data (loaded BEFORE game.js so innate school commands
       innate_fire / innate_space / innate_luck register right away) -->
<script src="data/rarities.js"></script>
<script src="data/items/trinkets.js"></script>
<script src="data/schools.js"></script>
<script src="data/stats.js"></script>
<script src="data/i18n_en.js"></script>
<script src="data/status_effects.js"></script>
<script src="data/affixes.js"></script>
<script src="data/items/index.js"></script>
<script src="data/weapons/index.js"></script>
<script src="data/spells/index.js"></script>
<script src="data/loot_tables.js"></script>

<!-- Systems -->
<script src="systems/rng.js"></script>
<script src="systems/stats.js"></script>
<script src="systems/status_effects.js"></script>
<script src="systems/player.js"></script>
<script src="systems/items.js"></script>
<script src="systems/weapons.js"></script>
<script src="systems/spells.js"></script>
<script src="systems/loot.js"></script>
<script src="systems/spell_loot.js"></script>
<script src="systems/chest_entities.js"></script>
<script src="systems/leveling.js"></script>
<script src="systems/innate.js"></script>
<script src="systems/world_items.js"></script>

<!-- Cheat command registry and game (after data, so innate_* registers immediately) -->
<script src="systems/cheats.js"></script>
<script src="game.js"></script>

<!-- UI -->
<script src="ui/tooltip.js"></script>
<script src="ui/rarity-fx.js"></script>
<script src="ui/inventory.js"></script>
<script src="ui/character_sheet.js"></script>
<script src="ui/status_icons.js"></script>
<script src="ui/spell_choice.js"></script>
<script src="ui/spellbook.js"></script>
<script src="ui/school_select.js"></script>
<script src="ui/weapons_hud.js"></script>
<script src="ui/codex.js"></script>
</body>
</html>
